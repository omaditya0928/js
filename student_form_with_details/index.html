<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Multiplication Table</title>
	<style>
		body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
		form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 20px 0; }
		input, button { font: inherit; padding: 9px 12px; }
		input { flex: 1; min-width: 120px; }
		button { cursor: pointer; }
		#error { color: #b00020; }
		pre { padding: 16px; overflow-x: auto; background: #f3f4f6; border-radius: 6px; line-height: 1.5; }
	</style>
</head>
<body>
	<h1>Multiplication Table</h1>
	<form id="table-form">
		<label for="number">Enter a number:</label>
		<input id="number" type="number" step="any" required>
		<button type="submit">Show table</button>
	</form>
	<p id="error" role="alert" aria-live="polite"></p>
	<pre id="result" aria-live="polite"></pre>

	<script>
		const form = document.getElementById("table-form");
		const numberInput = document.getElementById("number");
		const error = document.getElementById("error");
		const result = document.getElementById("result");

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			error.textContent = "";
			result.textContent = "";

			const rawValue = numberInput.value.trim();
			const number = Number(rawValue);
			if (rawValue === "" || !Number.isFinite(number)) {
				error.textContent = "Invalid input. Please provide a valid number.";
				return;
			}
			if (number === 0) {
				error.textContent = "Enter a valid number.";
				return;
			}

			const lines = [
				"Name :- Shreyas Chavan",
				"Roll No. :- 42404",
				`Multiplication Table for ${number}:`,
				"----------------------------",
				"",
				"For Loop"
			];
			for (let i = 1; i <= 10; i++) {
				lines.push(`${number} x ${i} = ${number * i}`);
			}

			lines.push("", "While Loop");
			let i = 1;
			while (i <= 10) {
				lines.push(`${number} x ${i} = ${number * i}`);
				i++;
			}

			lines.push("", "Do While Loop");
			let j = 1;
			do {
				lines.push(`${number} x ${j} = ${number * j}`);
				j++;
			} while (j <= 10);

			result.textContent = lines.join("\n");
		});
	</script>
</body>
</html>
