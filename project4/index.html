
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Comparison</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef3ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:900px;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#0b4fa3;
}

h2,h3{
    text-align:center;
    margin-top:5px;
    color:#444;
}

.input-box{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:20px 0;
}

.input-box input{
    width:250px;
    padding:10px;
    font-size:16px;
    border:2px solid #0b4fa3;
    border-radius:5px;
}

button{
    display:block;
    margin:auto;
    padding:10px 30px;
    font-size:17px;
    background:#0b4fa3;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#06387a;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

table th{
    background:#0b4fa3;
    color:white;
    padding:10px;
}

table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

table tr:nth-child(even){
    background:#f5f5f5;
}
</style>

</head>
<body>

<div class="container">

<h1>STRING Comparision</h1>
<h2>Shreyas Chavan</h2>
<h3>42404 | BE 8 (P8)</h3>

<div class="input-box">
<input type="text" id="str1" placeholder="Enter First String">
<input type="text" id="str2" placeholder="Enter Second String">
</div>

<button onclick="compareStrings()">Compare</button>

<table>
<thead>
<tr>
<th>Comparison Method</th>
<th>Result</th>
</tr>
</thead>

<tbody id="result">

</tbody>

</table>

</div>

<script src="script.js"></script>

</body>
</html>
