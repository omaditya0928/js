<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Operations</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4f6f9;
    padding:30px;
}

h1,h2,h3{
    text-align:center;
}

.container{
    max-width:1200px;
    margin:auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:25px;
}

.box{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,.15);
}

.box h3{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    padding:10px 18px;
    background:#0b79d0;
    color:#fff;
    border:none;
    cursor:pointer;
    border-radius:5px;
    white-space:nowrap;
}

.action{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
}

.out{
    flex:1;
    background:#eee;
    padding:10px;
    min-height:40px;
    border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

<h1>STRING OPERATIONS</h1>
<h2>Shreyas Chavan</h2>
<h3>42404 | BE 8 (P8)</h3>

<div class="grid">

<!-- Reverse -->
<div class="box">
<h3>Reverse</h3>

<input type="text" id="revInput" placeholder="Enter String">

<div class="action">
<button onclick="handleReverse()">Reverse</button>
<div id="revOutput" class="out">Output</div>
</div>

</div>

<!-- Replace -->
<div class="box">
<h3>Replace</h3>

<input type="text" id="repInput" placeholder="Enter String">
<input type="text" id="repTarget" placeholder="Old Character">
<input type="text" id="repReplacement" placeholder="New Character">

<div class="action">
<button onclick="handleReplaceSingle()">Replace</button>
<div id="repOutputSingle" class="out">Output</div>
</div>

<div class="action">
<button onclick="handleReplaceAll()">Replace All</button>
<div id="repOutputAll" class="out">Output</div>
</div>

</div>

<!-- Palindrome -->
<div class="box">
<h3>Palindrome</h3>

<input type="text" id="palInput" placeholder="Enter String">

<div class="action">
<button onclick="handlePalindrome()">Check</button>
<div id="palOutput" class="out">Output</div>
</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
